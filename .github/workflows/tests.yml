name: Testes Python e PostgreSQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.12 e PostgreSQL 18
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: auto_test
          POSTGRES_DB: postgres
          # Somente no container descartável do runner, com dados fictícios.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U auto_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PYTHONUTF8: '1'
      AUTO_TEST_PG_ISOLATED: '1'
      AUTO_TEST_PG_ADMIN_URL: postgresql+psycopg2://auto_test@127.0.0.1:5432/postgres
    steps:
      - name: Obter código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Instalar dependências fixadas
        run: python -m pip install -r requirements-lock.txt
      - name: Verificar dependências
        run: python -m pip check
      - name: Registrar versões do ambiente
        run: |
          python --version
          python -c "import os; from sqlalchemy import create_engine, text; engine = create_engine(os.environ['AUTO_TEST_PG_ADMIN_URL']); conn = engine.connect(); print(conn.execute(text('SELECT version()')).scalar()); conn.close(); engine.dispose()"
      - name: Executar testes, exigindo PostgreSQL
        run: python scripts/run_tests.py --require-postgresql --result-path .local-test/ci-result.json
      - name: Registrar resumo
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          result = Path('.local-test/ci-result.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              if not result.exists():
                  summary.write('Validação incompleta: o executor não gerou resultado. Consulte os logs.\n')
              else:
                  data = json.loads(result.read_text(encoding='utf-8'))
                  summary.write('### Resultado dos testes\n\n')
                  for key in ('tests_run', 'failures', 'errors', 'skipped', 'successful', 'postgresql_required'):
                      summary.write(f'- {key}: {data[key]}\n')
          PY
